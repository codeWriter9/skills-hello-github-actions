logging:
    level:
        root: INFO
        kata.zero.*: DEBUG

local:
    server:
        port: 8080

spring:
    sql:
        init:
            mode: always
            data-locations: classpath:db/data.sql
    datasource:
        initialization-mode: always

    jpa:
        properties:
            jakarta:
                persistence:
                    sharedCache:
                        mode: UNSPECIFIED
        open-in-view: false
        show-sql: true
        defer-datasource-initialization: true
        defer-initialization: true
        hibernate:
            ddl-auto: create-drop
